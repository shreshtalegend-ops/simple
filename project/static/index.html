<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSTM Algorithmic Trading Replay</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .metrics-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .metric-card {
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
        .signal-buy { color: #00ff00; }
        .signal-sell { color: #ff3333; }
        .signal-hold { color: #aaaaaa; }
        .chart-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            height: 60vh;
        }
        button {
            background-color: #2962ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #1c44b2; }
    </style>
</head>
<body>

    <div class="header">
        <h2>LSTM Trading Replay Engine</h2>
        <div>
            <select id="tickerSelect" style="padding: 10px; background: #333; color: white; border: none; border-radius: 5px; margin-right: 10px;">
                <option value="AAPL">AAPL</option>
                <option value="MSFT">MSFT</option>
                <option value="TSLA">TSLA</option>
                <option value="AMZN">AMZN</option>
            </select>
            <button onclick="startSimulation()">Start Simulation</button>
        </div>
    </div>

    <div class="metrics-container">
        <div class="metric-card">
            <div>Portfolio Balance</div>
            <div id="balance" class="metric-value">$100,000.00</div>
        </div>
        <div class="metric-card">
            <div>Actual Price</div>
            <div id="actualPrice" class="metric-value">--</div>
        </div>
        <div class="metric-card">
            <div>LSTM Prediction (Next Minute)</div>
            <div id="predictedPrice" class="metric-value">--</div>
        </div>
        <div class="metric-card">
            <div>Latest Action</div>
            <div id="actionSignal" class="metric-value signal-hold">HOLD</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="priceChart"></canvas>
    </div>

    <script>
        // 1. Initialize Chart.js
        const ctx = document.getElementById('priceChart').getContext('2d');
        const maxDataPoints = 60; // Keep only the last 60 minutes on screen

        const priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Timestamps go here
                datasets: [
                    {
                        label: 'Actual Price',
                        data: [],
                        borderColor: '#00e676', // Green
                        backgroundColor: 'rgba(0, 230, 118, 0.1)',
                        borderWidth: 2,
                        tension: 0.1,
                        fill: true
                    },
                    {
                        label: 'LSTM Prediction',
                        data: [],
                        borderColor: '#d500f9', // Purple
                        borderWidth: 2,
                        borderDash: [5, 5], // Dashed line to show it's a forecast
                        tension: 0.1,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, // CRITICAL: Disable animation for smooth live streaming
                scales: {
                    x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
                    y: { ticks: { color: '#aaa' }, grid: { color: '#333' } }
                },
                plugins: {
                    legend: { labels: { color: '#fff' } }
                }
            }
        });

        // 2. Establish WebSocket Connection
        const ws = new WebSocket(`\ws://${window.location.host}/ws/stream`);

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Format timestamp (e.g., "10:30:00")
            const timeString = new Date(data.timestamp).toLocaleTimeString();

            // Update DOM Metrics
            document.getElementById('balance').innerText = `$${data.portfolio_balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('actualPrice').innerText = `$${data.actual_price.toFixed(2)}`;
            document.getElementById('predictedPrice').innerText = `$${data.predicted_price.toFixed(2)}`;
            
            const actionEl = document.getElementById('actionSignal');
            actionEl.innerText = data.action;
            actionEl.className = 'metric-value ' + (data.action === 'BUY' ? 'signal-buy' : data.action === 'SELL' ? 'signal-sell' : 'signal-hold');

            // Update Chart Data Arrays
            priceChart.data.labels.push(timeString);
            priceChart.data.datasets[0].data.push(data.actual_price);
            priceChart.data.datasets[1].data.push(data.predicted_price);

            // Prevent memory leaks by shifting old data out of the array
            if (priceChart.data.labels.length > maxDataPoints) {
                priceChart.data.labels.shift();
                priceChart.data.datasets[0].data.shift();
                priceChart.data.datasets[1].data.shift();
            }

            // Force chart re-render
            priceChart.update();
        };

        ws.onclose = function() {
            console.error("WebSocket connection closed.");
            document.getElementById('actionSignal').innerText = "DISCONNECTED";
        };

        // 3. Start Simulation REST API Call
        async function startSimulation() {
            const ticker = document.getElementById('tickerSelect').value;
            try {
                const response = await fetch(`http://${window.location.host}/start?ticker=${ticker}`, {
                    method: 'POST'
                });
                const result = await response.json();
                console.log(result);
                
                // Clear the chart for the new run
                priceChart.data.labels = [];
                priceChart.data.datasets[0].data = [];
                priceChart.data.datasets[1].data = [];
                priceChart.update();
                
            } catch (error) {
                console.error("Error starting simulation:", error);
            }
        }
    </script>
</body>
</html>
